<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Colet Control Center</title>
<style>
  body { background:#111; color:#e8e8e8; font-family: ui-monospace, Menlo, Consolas, monospace; margin:16px; }
  h1 { font-size:18px; margin:0 0 8px; }
  .row { margin:6px 0; }
  #linkState, #phoneState { white-space:pre-wrap; }
  #feed { background:#000; border:1px solid #444; padding:10px; min-height:220px; white-space:pre-wrap; font-size:14px; }
  #log { background:#181818; border:1px solid #333; padding:8px; height:140px; overflow:auto; white-space:pre-wrap; font-size:12px; }
  button { background:#222; color:#e8e8e8; border:1px solid #555; padding:6px 10px; margin:2px; cursor:pointer; }
  button:hover { background:#333; }
  input { background:#000; color:#e8e8e8; border:1px solid #555; padding:6px; margin:2px; }
  .ok { color:#7ee787; } .bad { color:#ff7b72; } .dim { color:#999; }
</style>
</head>
<body>
<h1>Colet Control Center</h1>
<div class="row" id="linkState">LINK: starting…</div>
<div class="row" id="phoneState">PHONE: unknown</div>
<div class="row">
  <button data-cmd="ping">Ping</button>
  <button data-cmd="foreground">Foreground app</button>
  <button data-cmd="uitree">UI tree now</button>
  <button data-key="back">Back</button>
  <button data-key="home">Home</button>
  <button data-key="recents">Recents</button>
  <button data-key="notifications">Notifications</button>
  <button data-cmd="wake">Wake 10m</button>
  <button data-cmd="lock">Lock</button>
</div>
<div class="row">
  <input id="tapTextQuery" placeholder="button text to tap" size="24">
  <button id="tapTextBtn">Tap by text</button>
  <input id="typeText" placeholder="text to type" size="24">
  <button id="typeBtn">Type</button>
</div>
<div class="row">
  <input id="termuxCmd" placeholder="Termux command" size="40">
  <button id="termuxBtn">Run in Termux</button>
</div>
<div class="row dim">SCREEN FEED (raw data — the phone's screen as words):</div>
<div id="feed">(waiting for the phone's first snapshot…)</div>
<div class="row dim">LOG:</div>
<div id="log"></div>

<script>
(function () {
  // Transport (v1.5): plain HTTPS pub/sub via ntfy.sh — no MQTT.
  //   colet-<id>-ui   phone publishes snapshots + status; this page polls it
  //   colet-<id>-cmd  this page POSTs commands; the phone polls it
  //   colet-<id>-res  phone publishes command results; this page polls it
  // Command JSON matches the app: {"id", "type", "params"}.
  var deviceId = (location.hash || "").replace(/^#/, "").trim();
  var NTFY = "https://ntfy.sh";
  var uiTopic = "colet-" + deviceId + "-ui";
  var cmdTopic = "colet-" + deviceId + "-cmd";
  var resTopic = "colet-" + deviceId + "-res";

  var pending = {};   // cmdId -> {resolve, timer}
  var lastStatus = null;
  var lastUi = null;
  var lastUiMsgId = null;    // ntfy cursor for the ui topic
  var lastResMsgId = null;   // ntfy cursor for the res topic
  var pageLoadSec = Math.floor(Date.now() / 1000);
  var linkOkAt = 0;          // last successful poll (ms epoch)
  var linkError = null;

  var elLink = document.getElementById("linkState");
  var elPhone = document.getElementById("phoneState");
  var elFeed = document.getElementById("feed");
  var elLog = document.getElementById("log");

  function log(msg) {
    var line = "[" + new Date().toLocaleTimeString() + "] " + msg;
    elLog.textContent += (elLog.textContent ? "\n" : "") + line;
    elLog.scrollTop = elLog.scrollHeight;
  }
  function renderLink() {
    if (!deviceId) {
      elLink.textContent = "LINK: no device id in the URL fragment (#<id>)";
      elLink.className = "row bad";
      return;
    }
    if (linkError) {
      elLink.textContent = "LINK: polling ntfy.sh — last poll failed: " + linkError;
      elLink.className = "row bad";
    } else if (linkOkAt) {
      elLink.textContent = "LINK: polling ntfy.sh — last ok " +
        new Date(linkOkAt).toLocaleTimeString();
      elLink.className = "row ok";
    } else {
      elLink.textContent = "LINK: polling ntfy.sh…";
      elLink.className = "row";
    }
  }
  function latestPhoneTs() {
    var ts = 0;
    if (lastStatus && lastStatus.ts) ts = Math.max(ts, lastStatus.ts);
    if (lastUi && lastUi.ts) ts = Math.max(ts, lastUi.ts);
    return ts;
  }
  function renderPhone() {
    var ts = latestPhoneTs();
    if (!ts) { elPhone.textContent = "PHONE: not seen yet"; elPhone.className = "row"; return; }
    var age = Math.max(0, Math.round((Date.now() - ts) / 1000));
    if (age <= 45) {
      var s = "PHONE: online";
      if (lastStatus) {
        s += " — app v" + (lastStatus.control_version || "?") +
          ", foreground: " + (lastStatus.package || "?") +
          ", accessibility: " + (lastStatus.a11y ? "ON" : "off") +
          ", feed: " + (lastStatus.feed || "?");
      } else if (lastUi) {
        s += " — foreground: " + (lastUi.package || "?");
      }
      s += ", last heard " + age + "s ago";
      elPhone.textContent = s;
      elPhone.className = "row ok";
    } else {
      elPhone.textContent = "PHONE: last seen " + age + "s ago (silent — app off or phone asleep?)";
      elPhone.className = "row bad";
    }
  }
  function renderFeed() {
    if (!lastUi) return;
    var age = Math.max(0, Math.round((Date.now() - lastUi.ts) / 1000));
    var head = "APP: " + (lastUi.package || "?") + "  (snapshot " + age + "s old)\n\n";
    elFeed.textContent = head + (lastUi.text || "(no text in snapshot)");
  }
  setInterval(function () { renderLink(); renderPhone(); renderFeed(); }, 2000);

  if (!deviceId) { renderLink(); return; }

  // ---- ntfy polling ----

  // GETs one topic's new messages (NDJSON) and calls fn(parsedBody, rawEvent)
  // for each message event. Returns the newest message id seen, or the
  // cursor unchanged when nothing arrived.
  function pollTopic(topic, since, fn) {
    var url = NTFY + "/" + topic + "/json?poll=1&since=" + encodeURIComponent(since);
    return fetch(url).then(function (r) {
      if (!r.ok) throw new Error("HTTP " + r.status);
      return r.text();
    }).then(function (text) {
      var newest = since;
      text.split("\n").forEach(function (line) {
        line = line.trim();
        if (!line) return;
        var evt;
        try { evt = JSON.parse(line); } catch (e) { return; }
        if (evt.id) newest = evt.id;
        if (evt.event !== "message") return;
        try { fn(JSON.parse(evt.message), evt); } catch (e) {}
      });
      return newest;
    });
  }

  function pollCycle() {
    var uiP = pollTopic(uiTopic, lastUiMsgId || "all", function (body) {
      if (body.type === "status") { lastStatus = body; renderPhone(); }
      else { lastUi = body; renderFeed(); }
    }).then(function (newest) { lastUiMsgId = newest; });
    // Results: ignore anything older than this page load — stale results
    // from earlier sessions are not answers to this page's commands.
    var resP = pollTopic(resTopic, lastResMsgId || String(pageLoadSec), function (body) {
      var slot = pending[body.id];
      if (slot) {
        clearTimeout(slot.timer);
        delete pending[body.id];
        slot.resolve(body);
      }
    }).then(function (newest) { lastResMsgId = newest; });
    Promise.all([uiP, resP]).then(function () {
      linkOkAt = Date.now();
      linkError = null;
      renderLink();
    }).catch(function (e) {
      linkError = (e && e.message) || "network error";
      renderLink();
    });
  }
  log("polling ntfy.sh topics for device " + deviceId);
  pollCycle();
  setInterval(pollCycle, 2500);

  // ---- sending commands ----

  function send(type, params) {
    return new Promise(function (resolve) {
      var id = Math.random().toString(16).slice(2, 14);
      var timer = setTimeout(function () {
        delete pending[id];
        resolve({ ok: false, error: "timeout waiting for phone" });
      }, 25000);
      pending[id] = { resolve: resolve, timer: timer };
      fetch(NTFY + "/" + cmdTopic, {
        method: "POST",
        body: JSON.stringify({ id: id, type: type, params: params || {} })
      }).then(function (r) {
        if (!r.ok) {
          clearTimeout(timer);
          delete pending[id];
          resolve({ ok: false, error: "command POST failed: HTTP " + r.status });
        }
      }).catch(function (e) {
        clearTimeout(timer);
        delete pending[id];
        resolve({ ok: false, error: "command POST failed: " + ((e && e.message) || e) });
      });
    });
  }

  // ---- controls (unchanged from the MQTT-era page) ----

  document.querySelectorAll("[data-cmd]").forEach(function (b) {
    b.addEventListener("click", function () {
      var type = b.getAttribute("data-cmd");
      var params = type === "wake" ? { minutes: 10 } : {};
      log("-> " + type);
      send(type, params).then(function (r) {
        log("<- " + type + ": " + JSON.stringify(r).slice(0, 500));
        if (type === "uitree" && r && r.ok && r.data && r.data.tree) {
          lastUi = { ts: Date.now(), package: lastStatus ? lastStatus.package : "?",
            text: r.data.tree.map(function (n) {
              var label = n.t || n.d; if (!label) return null;
              var s = "- " + label;
              if (n.c && n.b) s += "  [tap @" + Math.round((n.b[0] + n.b[2]) / 2) + "," + Math.round((n.b[1] + n.b[3]) / 2) + "]";
              return s;
            }).filter(Boolean).join("\n") };
          renderFeed();
        }
      });
    });
  });
  document.querySelectorAll("[data-key]").forEach(function (b) {
    b.addEventListener("click", function () {
      var name = b.getAttribute("data-key");
      log("-> key " + name);
      send("key", { name: name }).then(function (r) { log("<- key " + name + ": " + JSON.stringify(r).slice(0, 300)); });
    });
  });
  document.getElementById("tapTextBtn").addEventListener("click", function () {
    var q = document.getElementById("tapTextQuery").value;
    if (!q) return;
    log("-> taptext " + q);
    send("taptext", { query: q }).then(function (r) { log("<- taptext: " + JSON.stringify(r).slice(0, 300)); });
  });
  document.getElementById("typeBtn").addEventListener("click", function () {
    var t = document.getElementById("typeText").value;
    if (!t) return;
    log("-> type");
    send("type", { text: t }).then(function (r) { log("<- type: " + JSON.stringify(r).slice(0, 300)); });
  });
  document.getElementById("termuxBtn").addEventListener("click", function () {
    var cmd = document.getElementById("termuxCmd").value;
    if (!cmd) return;
    log("-> termux: " + cmd);
    send("termux", { command: cmd, background: true, timeout: 30 }).then(function (r) {
      log("<- termux: " + JSON.stringify(r).slice(0, 800));
    });
  });
})();
</script>
</body>
</html>
