<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tulsa Weather</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: linear-gradient(180deg, #7ec3ee 0%, #a8d4f5 45%, #d6ecfd 100%);
    color: #173a52; min-height: 100vh; padding: 26px 14px 40px; }
  .wrap { max-width: 480px; margin: 0 auto; text-align: center; }
  .icon { font-size: 84px; margin-top: 20px; }
  h1 { font-size: 32px; font-weight: 700; margin-top: 6px; }
  .sub { font-size: 15px; color: #3d6482; margin-top: 4px; }
  .now { font-size: 17px; margin-top: 14px; }
  .card { background: rgba(255,255,255,.55); border-radius: 16px; padding: 16px;
    margin-top: 26px; box-shadow: 0 2px 10px rgba(30,80,120,.12); text-align: left; }
  .card h3 { font-size: 12px; letter-spacing: 1px; color: #3d6482; margin-bottom: 10px; }
  .card input { width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #9db9cf;
    font-size: 16px; margin-bottom: 8px; background: #fff; }
  .card button { width: 100%; padding: 12px; border: none; border-radius: 10px;
    background: #2f7fc4; color: #fff; font-size: 16px; font-weight: 600; cursor: pointer; }
  .card .msg { font-size: 13px; color: #3d6482; margin-top: 8px; min-height: 16px; }
  footer { text-align: center; font-size: 12px; color: #5b7d99; margin-top: 22px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="icon">⛅</div>
  <h1>Tulsa Weather</h1>
  <div class="sub">Tulsa, Oklahoma</div>
  <div class="now">65° · Partly cloudy · Rain tonight</div>

  <div class="card">
    <h3>MEMBERS SIGN IN</h3>
    <input type="password" id="g_pw" placeholder="Password" autocomplete="off">
    <button id="g_go">Sign in</button>
    <div class="msg" id="g_msg"></div>
  </div>

  <footer>Tulsa Weather · Local forecast for the Tulsa area</footer>
</div>

<script>
  try { if (window.Telegram && Telegram.WebApp) { Telegram.WebApp.ready(); Telegram.WebApp.expand(); } } catch (e) {}
  var PARTY = "../females/females.html";
  var WX = "weather.html";
  function hwHash(s) {
    var h1 = 0xdeadbeef, h2 = 0x41c6ce57;
    for (var i = 0; i < s.length; i++) {
      var ch = s.charCodeAt(i);
      h1 = Math.imul(h1 ^ ch, 2654435761);
      h2 = Math.imul(h2 ^ ch, 1597334677);
    }
    h1 = Math.imul(h1 ^ (h1 >>> 16), 2246822507) ^ Math.imul(h2 ^ (h2 >>> 13), 3266489909);
    h2 = Math.imul(h2 ^ (h2 >>> 16), 2246822507) ^ Math.imul(h1 ^ (h1 >>> 13), 3266489909);
    return (h2 >>> 0).toString(16) + (h1 >>> 0).toString(16);
  }
  function hwGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
  function hwSet(k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  function gHint() {
    var m = document.getElementById("g_msg");
    if (!hwGet("ft_hw_r")) m.textContent = "First time here: type your REAL password (4+ letters) and tap Sign in — the next step sets your second password.";
    else if (!hwGet("ft_hw_h")) m.textContent = "Now set your second password — the one that opens the weather app.";
    else m.textContent = "";
  }
  function gSignin() {
    var inp = document.getElementById("g_pw");
    var msg = document.getElementById("g_msg");
    var pw = (inp.value || "").trim();
    if (pw.length < 4) { msg.textContent = "Password needs at least 4 letters."; return; }
    var r = hwGet("ft_hw_r"), h = hwGet("ft_hw_h");
    if (!r) {
      hwSet("ft_hw_r", hwHash("ft::" + pw)); inp.value = "";
      msg.textContent = "Real password saved. Now set your second password.";
      gHint(); return;
    }
    if (!h) {
      if (hwHash("ft::" + pw) === r) { msg.textContent = "That is the same as your real one — pick a different second password."; return; }
      hwSet("ft_hw_h", hwHash("ft::" + pw)); inp.value = "";
      msg.textContent = "Second password saved. You are all set.";
      gHint(); return;
    }
    if (hwHash("ft::" + pw) === r) {
      location.href = PARTY;
    } else if (hwHash("ft::" + pw) === h) {
      location.href = WX;
    } else {
      msg.textContent = "Wrong password.";
    }
  }
  document.getElementById("g_go").addEventListener("click", gSignin);
  document.getElementById("g_pw").addEventListener("keydown", function (e) { if (e.key === "Enter") gSignin(); });
  gHint();
</script>
</body>
</html>
